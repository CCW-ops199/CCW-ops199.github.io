    <h1>給未來自己的第一封信</h1>
    <div class="date">A NOTE TO MY FUTURE SELF</div>

    <article>
      <p>親愛的未來的自己：</p>

      <p>
        如果有一天你重新讀到這篇文字，
        希望你記得，人生不一定每個階段都需要一個明確的答案。
      </p>

      <p>
        有時候，我們需要的不是跑得更快，
        而是停下來，認真想一想自己正在走向哪裡。
      </p>

      <p>
        把值得記住的事情寫下來，
        不代表每件事都已經想通。
        只希望未來回望時，能看見自己曾經如何思考、
        如何改變，以及如何慢慢成為想成為的人。
      </p>

      <p>願你一直保有好奇心，也有勇氣重新開始。</p>
    </article>
